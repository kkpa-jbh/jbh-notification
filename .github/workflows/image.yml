# Image: builds the jbh-notification Docker image for two CPU types (amd64 and arm64)
# and pushes both to GHCR (GitHub Container Registry) under ONE tag: the git SHA (and "latest", only for the newest commit on main).
#
# When it runs: after every push to main, or by hand.
# What it changes: the GHCR package ghcr.io/kkpa-jbh/jbh-notification. It deploys nothing.
# The VPS only pulls this image. It never builds Maven itself. The tests run in ci.yml.
#
# Jobs, in order:
# 1. package - builds the Quarkus fast-jar once (it does not depend on the CPU type).
# 2. image   - calls the reusable workflow jbh-deploy/.github/workflows/multi-arch-image.yml. It builds
#              "Build image (amd64)" and "Build image (arm64)" on native runners, publishes one tag for both,
#              and keeps the 10 newest tagged images. One file in jbh-deploy serves all 5 service repos.
#
# More: jbh-deploy/CI.md ("Image" and "Multi-arch image").

# The name shown in the GitHub "Actions" tab.
name: Image

on:
  # Adds a "Run workflow" button in the Actions tab, to build an image by hand.
  workflow_dispatch:
  # Runs on every push to main. A merged PR is a push to main, so this runs after each merge.
  push:
    branches: [ main ]

# The automatic GITHUB_TOKEN gets no permission at the top. Each job asks only for what it needs.
permissions: {}

# One run at a time for the whole repo. GitHub does not promise the order of waiting runs,
# so the reusable workflow moves "latest" only for the newest commit on main.
# - group: the workflow name only, not the branch. A run started by hand on another branch waits too.
#   Otherwise its cleanup could delete the untagged digests of a run that has not tagged them yet.
# - queue: max -> every waiting run stays in the queue (up to 100). The default (single) cancels a waiting run
#   when a newer one arrives, and that commit would never get its image.
# - cancel-in-progress: false -> a running build is never stopped halfway (that could leave pushed digests with no tag).
concurrency:
  group: ${{ github.workflow }}
  queue: max
  cancel-in-progress: false

jobs:
  # Builds the Quarkus fast-jar once. Machine: a GitHub-hosted Ubuntu VM, deleted after the run.
  # The fast-jar is plain Java bytecode, so the same files go into the amd64 and the arm64 image.
  package:
    name: Build the app package
    runs-on: ubuntu-latest
    # A Maven package without tests takes about 3 minutes. 20 leaves room for a cold cache.
    timeout-minutes: 20
    permissions:
      # Download the code.
      contents: read
      # maven-settings.xml uses GITHUB_TOKEN for server "github" (this repo's own packages).
      packages: read
    steps:
      # The VM starts empty. This step downloads the code of the pushed commit into it.
      # Actions are pinned to a full commit SHA (the version is in the comment), so a moved tag cannot change them.
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs Java 21 (Temurin build). "cache: maven" saves ~/.m2 between runs,
      # so Maven does not download every dependency again each time.
      - name: Set up Java 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Builds the Quarkus fast-jar in jbh-notification-app/target/quarkus-app.
      # The Dockerfile only copies that folder, so Docker needs no Maven.
      # -B: batch mode, plain logs.
      # -U: the ~/.m2 cache is restored, so force a check for a newer jbh-commons-lib SNAPSHOT.
      # -s .github/maven-settings.xml: the Maven settings file with the logins for GitHub Packages.
      # -Pgithub: turns on the "github" profile in pom.xml, to read jbh-commons-lib from GitHub Packages.
      # -pl jbh-notification-app: build only the app module.
      # -am: "also make". Also builds the modules the app needs (parent, contracts, infra).
      # -DskipTests: do not run the tests (ci.yml runs them).
      # package: the Maven phase that builds the jar; nothing is uploaded.
      - name: Package Quarkus app
        run: mvn -B -U -s .github/maven-settings.xml -Pgithub -pl jbh-notification-app -am -DskipTests package
        env:
          # GitHub creates this token for each run; it is not a secret you add by hand.
          # maven-settings.xml uses it for server "github" (this repo's packages).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A repo secret you add by hand (Settings → Secrets and variables → Actions): a classic token with
          # only read:packages. maven-settings.xml uses it for server "github-packages-read", to download jbh-commons-lib.
          PACKAGES_READ_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}

      # Hands the fast-jar folder to the image jobs (each job runs on its own VM, so files do not carry over).
      # The whole folder: quarkus-run.jar needs lib/, app/ and quarkus/ next to it.
      # retention-days: 1 -> the artifact is only needed during this run.
      - name: Upload the app package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-package
          path: jbh-notification-app/target/quarkus-app/
          retention-days: 1

  # Builds, tags and cleans the image, through the reusable workflow in jbh-deploy.
  # needs: package -> it waits for the fast-jar (the artifact "app-package").
  # Pinned to a jbh-deploy commit SHA, like an action: a change there reaches this repo only when you bump the SHA.
  # In the Actions tab its jobs show as "Build and publish the image / Build image (amd64)", and so on.
  image:
    name: Build and publish the image
    needs: package
    # The most the called jobs may use: read the code, push and delete images in GHCR.
    permissions:
      contents: read
      packages: write
    uses: kkpa-jbh/jbh-deploy/.github/workflows/multi-arch-image.yml@8e2034e55480624e869863dbced9d10f04eb799c # JBH-86
    with:
      image: ghcr.io/kkpa-jbh/jbh-notification
      package-name: jbh-notification
      # The folder Docker builds from: it holds the Dockerfile and target/quarkus-app.
      context: jbh-notification-app
      # The Dockerfile copies target/quarkus-app/ (relative to the context).
      app-package-path: jbh-notification-app/target/quarkus-app
